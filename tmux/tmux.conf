# fleetmux-managed — agent-native tmux config
# One-command install: bash <(curl -fsSL https://raw.githubusercontent.com/xiaolongnk/fleetmux/main/bin/install.sh)
#
# TPM plugins are installed on first launch. Relaunch tmux after running:
#   ~/.tmux/plugins/tpm/bin/install_plugins

# ── plugin manager (TPM) ─────────────────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# resurrect + continuum: auto-save/restore sessions
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# ── sensible defaults ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ',xterm-256color:RGB'
set -g history-limit 50000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 0
set -g focus-events on

# ── mouse support ─────────────────────────────────────────────────────────────
# mouse on enables ALL mouse interactions — no prefix key needed:
#   • click a pane      → focus it
#   • click a window    → switch to it
#   • drag pane border  → resize pane
#   • scroll wheel      → enter copy-mode and scroll through scrollback history
# Works in all modern terminals (iTerm2, Alacritty, Ghostty, xterm, WezTerm…).
#
# STUCK PANE? A wheel-scroll just dropped you into copy-mode (stock tmux
# behavior, not a bug/hang). Get out with any of: q · Esc · Ctrl-c (all pre-bound to
# cancel copy-mode in this config). Nothing is lost — your session keeps
# running underneath.
set -g mouse on

# Explicit escape ladder for copy-mode — belt-and-suspenders on tmux's own
# defaults (already bound this way stock) so a --prefix remap or a plugin
# can never silently take these away.
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi C-c send-keys -X cancel
bind -T copy-mode q send-keys -X cancel
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode C-c send-keys -X cancel

# ── prefix: Ctrl-q (default) ─────────────────────────────────────────────────
unbind C-b
set -g prefix C-q
bind C-q send-prefix

# ── core keybindings ─────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Splits that remember the current path
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
unbind |
unbind _

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── agent-pane jump bindings ─────────────────────────────────────────────────
# Cycle through the panes running an agent (detected by the pane's running command,
# same probe as the status bar — see AGENTS.md). Press again to go to the next one.
bind a   run-shell "~/.config/tmux/scripts/agent-jump.sh claude"
bind e   run-shell "~/.config/tmux/scripts/agent-jump.sh codex"
bind g   run-shell "~/.config/tmux/scripts/agent-jump.sh gemini"
bind Tab run-shell "~/.config/tmux/scripts/agent-jump.sh any"
bind Enter run-shell "~/.config/tmux/scripts/agent-jump.sh waiting"   # next agent that needs you

# prefix + ? → show fleetmux cheat sheet in a new window
bind ? new-window -n "fleetmux-help" "cat ~/.config/tmux/CHEATSHEET.md 2>/dev/null || echo 'Cheat sheet not found — see https://github.com/xiaolongnk/fleetmux'; read"

# ── first-run guided intro ────────────────────────────────────────────────────
# Displays a Quick Start popup exactly once, when the first-ever tmux session
# is created. Controlled by sentinel: ~/.config/tmux/.firstrun-done
# Delete that file to see the popup again. Runs in background (-b) so session
# creation is never blocked. Requires tmux ≥ 3.2 (display-popup support).
set-hook -g session-created "run-shell -b '~/.config/tmux/scripts/firstrun-popup.sh'"

# ── agent-aware status bar ────────────────────────────────────────────────────
# scripts/agent-status.sh looks at every pane's running command (#{pane_current_command})
# and shows a count per agent, plus an amber ●N for panes waiting for you (idle or asking
# for approval, read from the pane's screen): "⬡ Claude 2 ●1  ◆ Codex 1".
# No daemon required — empty when no agent is running. Titles are only a fallback for
# agents that run under a generic runtime (node/python). Details: AGENTS.md.
#
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=default,fg=colour252"

# Left: session name.
set -g status-left-length 46
set -g status-left "#[fg=colour39]#[bold] #S #[fg=default]#[bg=default]"

# Right: agent indicators + clock + host
set -g status-right-length 80
# Pinned here instead of left to tmux-continuum's own status-right injection:
# continuum's another_tmux_server_running guard misfires on agent boxes where
# harnesses/test suites leak scratch tmux servers on their own sockets, so the
# save hook silently never installs and @continuum-restore has nothing to
# restore from. continuum_save.sh self-throttles on a timestamp and takes a
# lock, so invoking it directly here is safe even if continuum also tries.
set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#(~/.config/tmux/scripts/agent-status.sh 2>/dev/null)#[fg=colour244] %H:%M #[fg=colour252]#h '

# Window list: highlight active
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=colour39,bold] #I:#W #[fg=default,bg=default]"
setw -g window-status-style          "fg=colour244"
setw -g window-status-current-style  "fg=colour39,bold"

# Pane borders
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# ── machine-local overrides ──────────────────────────────────────────────────
# Written by the installer (e.g. `set -g default-shell /opt/homebrew/bin/fish` after
# --with-fish) and free for your own additions; survives upgrades of this file.
source-file -q ~/.config/tmux/local.conf

# ── initialize TPM (MUST be last line) ───────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
