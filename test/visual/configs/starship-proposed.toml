# fleetmux-managed — generated by fleetmux installer
add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$status\
$cmd_duration\
$line_break\
$character"""

right_format = ""

[username]
show_always = false
format = "[$user]($style)@"
style_user = "bold cyan"
style_root = "bold red"

[hostname]
ssh_only = true
trim_at = "."
format = "[$hostname]($style) "
style = "bold cyan"

[directory]
truncation_length = 2
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " ro"
read_only_style = "bold red"

[git_branch]
symbol = "git:"
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold red"
conflicted = "="
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕↑${ahead_count}↓${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "x${count}"

[status]
disabled = false
format = "[exit $status]($style) "
style = "bold red"

[cmd_duration]
min_time = 2_000
format = "[took $duration]($style) "
style = "yellow"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
